<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Immortality Archive</title>

<meta name="description" content="An interactive database documenting humanity's historical, eccentric, and failed attempts to defeat death—spanning ancient mythology, toxic alchemy, and modern cryonics.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://theimmortalityarchive.com/">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "The Immortality Archive",
  "url": "https://theimmortalityarchive.com/",
  "description": "A chronological directory of historical figures, alchemists, and scientists who attempted to bypass human mortality.",
  "genre": "History / Philosophy",
  "inLanguage": "en-US"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080a;
  --bg-raised: #0f0f12;
  --bg-hover: #16161a;
  --text: #a8a4a0;
  --text-dim: #55524e;
  --text-bright: #ece8e1;
  --red: #c0392b;
  --red-dim: #7a2419;
  --red-glow: rgba(192, 57, 43, 0.15);
  --amber: #d4a24e;
  --amber-dim: #8a6a30;
  --border: #1e1d20;
  --display: 'Playfair Display', Georgia, serif;
  --mono: 'IBM Plex Mono', monospace;
  --body: 'Outfit', sans-serif;
}

html { background: var(--bg); color: var(--text); scroll-behavior: smooth; }

body {
  font-family: var(--body);
  font-weight: 300;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── GRAIN ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 10000;
}

/* ── LOGO BRANDING ── */
.site-logo {
  margin-bottom: 2rem;
  display: inline-block;
  cursor: pointer;
  opacity: 0;
  animation: fadeIn 1s ease 0.1s forwards;
  user-select: none;
  -webkit-user-drag: none;
}

.site-logo svg {
  width: 44px;
  height: 44px;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.site-logo:hover svg {
  transform: rotate(180deg);
}

/* ── DRAMATIC TRANSMISSION OVERLAY ── */
#glitch-overlay {
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 999999;
  display: none;
  align-items: center;
  justify-content: center;
}

#glitch-symbol {
  width: 20vw;
  height: 20vw;
  max-width: 180px;
  display: none;
}

/* ── LANDING PAGE ── */
#landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 4rem 2rem;
  text-align: center;
  position: relative;
}

.landing-tagline {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 2rem;
  opacity: 0;
  animation: fadeIn 1s ease 0.3s forwards;
}

.landing-title {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.8rem, 7vw, 6rem);
  color: var(--text-bright);
  line-height: 1.1;
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: fadeIn 1s ease 0.6s forwards;
}

.landing-title em {
  font-style: italic;
  color: var(--red);
}

.landing-sub {
  font-size: 1rem;
  color: var(--text-dim);
  max-width: 460px;
  margin-bottom: 3rem;
  opacity: 0;
  animation: fadeIn 1s ease 0.9s forwards;
}

/* ── DEATH COUNTER ── */
.death-counter {
  margin-bottom: 3rem;
  opacity: 0;
  animation: fadeIn 1.2s ease 1.1s forwards;
}

.death-counter-number {
  font-family: var(--mono);
  font-size: 1.5rem;
  font-weight: 400;
  color: var(--text-bright);
  letter-spacing: 0.05em;
  line-height: 1;
  margin-bottom: 0.5rem;
}

.death-counter-label {
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  line-height: 1.5;
}

/* ── SHUFFLE BUTTON ── */
#shuffle-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 1rem 2.5rem;
  cursor: default;
  transition: all 0.3s ease;
  opacity: 0;
  animation: fadeIn 1s ease 1.4s forwards;
}

/* ── ANIMATIONS ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .death-counter-number {
    font-size: 1.2rem;
  }
}
</style>
</head>
<body>

<div id="glitch-overlay">
  <svg id="glitch-symbol" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 35,0 L 65,0 L 65,35 L 100,35 L 100,100 L 65,100 L 65,65 L 35,65 L 35,100 L 0,100 L 0,35 L 35,35 Z" fill="#ece8e1"/>
  </svg>
</div>

<section id="landing">
  <div class="site-logo" onclick="handleLogoClick()" title="The Immortality Archive Index">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 10H10V25" stroke="var(--border)" stroke-width="2"/>
      <path d="M75 10H90V25" stroke="var(--border)" stroke-width="2"/>
      <path d="M25 90H10V75" stroke="var(--border)" stroke-width="2"/>
      <path d="M75 90H90V75" stroke="var(--border)" stroke-width="2"/>
      <circle cx="50" cy="50" r="28" stroke="var(--red)" stroke-width="2" stroke-dasharray="170" stroke-dashoffset="5"/>
      <line x1="50" y1="12" x2="50" y2="88" stroke="var(--bg)" stroke-width="3"/>
      <line x1="50" y1="15" x2="50" y2="85" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
    </svg>
  </div>

  <p class="landing-tagline">5,000 years of trying</p>
  <h1 class="landing-title">The Immortality <em>Archive</em></h1>
  <p class="landing-sub">Humans have been trying to defeat death for almost as long as we’ve been alive. None of them have been successful. These are their stories</p>

  <div class="death-counter">
    <div class="death-counter-number" id="death-count">0</div>
    <div class="death-counter-label">people have died since you opened this page</div>
  </div>

  <button id="shuffle-btn">
    coming soon...
  </button>
</section>

<script>
// ══════════════════════════════════════
// DEATH COUNTER
// ══════════════════════════════════════
const DEATHS_PER_SECOND = 1.8;
let pageOpenTime = Date.now();
const deathCountEl = document.getElementById('death-count');

function updateDeathCount() {
  const elapsed = (Date.now() - pageOpenTime) / 1000;
  const deaths = Math.floor(elapsed * DEATHS_PER_SECOND);
  deathCountEl.textContent = deaths.toLocaleString();
  requestAnimationFrame(updateDeathCount);
}

requestAnimationFrame(updateDeathCount);

// ══════════════════════════════════════
// EASTER EGG TRACKER (STRICTLY ONCE)
// ══════════════════════════════════════
let logoClicks = 0;
let clickTimeout;
let eggHasTriggered = false;

function handleLogoClick() {
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (eggHasTriggered) return;

  logoClicks++;
  clearTimeout(clickTimeout);

  if (logoClicks === 10) {
    eggHasTriggered = true;
    logoClicks = 0;
    executeDramaticTransmission();
    return;
  }

  clickTimeout = setTimeout(() => {
    logoClicks = 0;
  }, 2500);
}

function executeDramaticTransmission() {
  const overlay = document.getElementById('glitch-overlay');
  const symbol = document.getElementById('glitch-symbol');

  symbol.style.display = 'none';
  overlay.style.display = 'flex';

  setTimeout(() => {
    symbol.style.display = 'block';
    setTimeout(() => {
      overlay.style.display = 'none';
      symbol.style.display = 'none';
    }, 20);
  }, 1800);
}
</script>

</body>
</html>
