<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Immortality Archive</title>

<link rel="icon" type="image/png" href="../favicon.png">
  
<meta name="description" content="An interactive database documenting humanity's historical, eccentric, and failed attempts to defeat death—spanning ancient mythology, toxic alchemy, and modern cryonics.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://theimmortalityarchive.com/">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "The Immortality Archive",
  "url": "https://theimmortalityarchive.com/",
  "description": "A chronological directory of historical figures, alchemists, and scientists who attempted to bypass human mortality.",
  "genre": "History / Philosophy",
  "inLanguage": "en-US"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="glitch-overlay">
  <svg id="glitch-symbol" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 35,0 L 65,0 L 65,35 L 100,35 L 100,100 L 65,100 L 65,65 L 35,65 L 35,100 L 0,100 L 0,35 L 35,35 Z" fill="#ece8e1"/>
  </svg>
</div>

<section id="landing">
  <div class="site-logo" onclick="handleLogoClick()" title="The Immortality Archive Index">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 10H10V25" stroke="var(--border)" stroke-width="2"/>
      <path d="M75 10H90V25" stroke="var(--border)" stroke-width="2"/>
      <path d="M25 90H10V75" stroke="var(--border)" stroke-width="2"/>
      <path d="M75 90H90V75" stroke="var(--border)" stroke-width="2"/>
      <circle cx="50" cy="50" r="28" stroke="var(--red)" stroke-width="2" stroke-dasharray="170" stroke-dashoffset="5"/>
      <line x1="50" y1="12" x2="50" y2="88" stroke="var(--bg)" stroke-width="3"/>
      <line x1="50" y1="15" x2="50" y2="85" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
    </svg>
  </div>

  <p class="landing-tagline">5,000 years of trying</p>
  <h1 class="landing-title">The Immortality <em>Archive</em></h1>
  <p class="landing-sub">Humans have been trying to defeat death for almost as long as we've been alive. None of them have been successful. These are their stories</p>

  <div class="death-counter">
    <div class="death-counter-number" id="death-count">0</div>
    <div class="death-counter-label">people have died since you opened this page</div>
  </div>

  <button id="shuffle-btn" onclick="showRandom()">
    <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 11V9a4 4 0 014-4h10M7 21l-4-4 4-4m14 4v2a4 4 0 01-4 4H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Show me one
  </button>

  <div style="margin-top: 2rem; opacity: 0; animation: fadeIn 1s ease 1.7s forwards;">
    <button onclick="window.location.href='archive.html'" style="background:none;border:none;font-family:var(--mono);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;transition:color 0.3s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">or browse all entries</button>
  </div>
</section>

<script>
// ══════════════════════════════════════
// DEATH COUNTER
// ══════════════════════════════════════
const DEATHS_PER_SECOND = 1.8;
let pageOpenTime = Date.now();
const deathCountEl = document.getElementById('death-count');

function updateDeathCount() {
  const elapsed = (Date.now() - pageOpenTime) / 1000;
  const deaths = Math.floor(elapsed * DEATHS_PER_SECOND);
  deathCountEl.textContent = deaths.toLocaleString();
  requestAnimationFrame(updateDeathCount);
}

requestAnimationFrame(updateDeathCount);

// ══════════════════════════════════════
// FAIR ENOUGH, SEE YOU AROUND.
// ══════════════════════════════════════
let logoClicks = 0;
let clickTimeout;
let eggHasTriggered = false;

function handleLogoClick() {
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (eggHasTriggered) return;

  logoClicks++;
  clearTimeout(clickTimeout);

  if (logoClicks === 10) {
    eggHasTriggered = true;
    logoClicks = 0;
    executeDramaticTransmission();
    return;
  }

  clickTimeout = setTimeout(() => {
    logoClicks = 0;
  }, 2500);
}

function executeDramaticTransmission() {
  const overlay = document.getElementById('glitch-overlay');
  const symbol = document.getElementById('glitch-symbol');

  symbol.style.display = 'none';
  overlay.style.display = 'flex';

  setTimeout(() => {
    symbol.style.display = 'block';
    setTimeout(() => {
      overlay.style.display = 'none';
      symbol.style.display = 'none';
    }, 20);
  }, 1800);
}

// ══════════════════════════════════════
// RANDOMISER
// ══════════════════════════════════════
function showRandom() {
  const entries = [
    'posts/gilgamesh.html',
    'posts/qinshihuang.html',
    'posts/jamesbedford.html',
    'posts/luigicornaro.html'

  ];
  
  const randomIndex = Math.floor(Math.random() * entries.length);
  window.location.href = entries[randomIndex];
}
</script>

</body>
</html>
