<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive - The Immortality Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080a;
  --bg-raised: #0f0f12;
  --bg-hover: #16161a;
  --text: #a8a4a0;
  --text-dim: #55524e;
  --text-bright: #ece8e1;
  --red: #c0392b;
  --red-dim: #7a2419;
  --border: #1e1d20;
  --display: 'Playfair Display', Georgia, serif;
  --mono: 'IBM Plex Mono', monospace;
  --body: 'Outfit', sans-serif;
}

html { background: var(--bg); color: var(--text); scroll-behavior: smooth; }

body {
  font-family: var(--body);
  font-weight: 300;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── GRAIN ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 10000;
}

/* ── ARCHIVE VIEW LAYOUT ── */
#all-entries {
  max-width: 900px;
  margin: 0 auto;
  padding: 6rem 2rem 4rem;
}

.entry-back {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 4rem;
  transition: color 0.3s;
  background: none;
  border: none;
  text-decoration: none;
}

.entry-back:hover { color: var(--red); }

.all-entries-title {
  font-family: var(--display);
  font-size: 1.8rem;
  color: var(--text-bright);
  margin-bottom: 0.5rem;
}

.all-entries-count {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  margin-bottom: 3rem;
}

.entry-card {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 2rem;
  padding: 2rem 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.3s;
}

.entry-card:hover { padding-left: 1rem; }
.entry-card:hover .entry-card-title { color: var(--red); }

.entry-card-year {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--red);
  letter-spacing: 0.1em;
  padding-top: 0.3rem;
}

.entry-card-title {
  font-family: var(--display);
  font-size: 1.3rem;
  color: var(--text-bright);
  transition: color 0.3s;
  margin-bottom: 0.3rem;
}

.entry-card-desc {
  font-size: 0.85rem;
  color: var(--text-dim);
}

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .entry-card {
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
}
</style>
</head>
<body>

<div id="all-entries">
  <a href="index.html" class="entry-back">← Back</a>
  <h2 class="all-entries-title">The Archive</h2>
  <p class="all-entries-count" id="entry-count"></p>
  <div id="entries-list"></div>
</div>

<script>
// ══════════════════════════════════════
// ARCHIVE DATA & DIRECT LINKS
// ══════════════════════════════════════
const entries = [
  {
    file: 'posts/gilgamesh.html',
    year: '~2700 BC',
    title: 'Gilgamesh',
    oneliner: 'The first human to be terrified of dying — and to write it down.'
  },
  {
    file: 'posts/qinshihuang.html',
    year: '210 BC',
    title: 'Qin Shi Huang',
    oneliner: 'The most powerful man alive drank mercury because someone told him it was the key to eternal life.'
  }
];

// ══════════════════════════════════════
// RENDER DIRECTORY
// ══════════════════════════════════════
const list = document.getElementById('entries-list');
document.getElementById('entry-count').textContent = `${entries.length} stories so far`;

list.innerHTML = entries.map(e => `
  <div class="entry-card" onclick="window.location.href='${e.file}'">
    <div class="entry-card-year">${e.year}</div>
    <div>
      <div class="entry-card-title">${e.title}</div>
      <div class="entry-card-desc">${e.oneliner}</div>
    </div>
  </div>
`).join('');
</script>

</body>
</html>
