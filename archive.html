<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive - The Immortality Archive</title>
<meta name="description" content="Every recorded attempt at immortality, in chronological order. From Gilgamesh to cryonics.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://theimmortalityarchive.com/archive.html">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Archive - The Immortality Archive">
<meta property="og:description" content="Every recorded attempt at immortality, in chronological order.">
<meta property="og:url" content="https://theimmortalityarchive.com/archive.html">
<meta property="og:site_name" content="The Immortality Archive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="all-entries">
  <a class="entry-back" href="index.html">&larr; Home</a>
  <h1 class="all-entries-title">The full record</h1>
  <p class="all-entries-count" id="entries-count">Loading&hellip;</p>
  <div id="entries-list"></div>
  <a class="archive-terminal" href="frontier.html">
    <div class="frontier-strip-label" style="justify-content:center; display:inline-flex;"><span class="live-dot"></span> Ongoing</div>
    <div class="archive-terminal-line">The frontier &mdash; one person is still further into life than everyone else. For now.</div>
  </a>
</div>
<script>
function parseYear(str) {
  const n = parseInt(String(str).replace(/[^0-9-]/g, ''), 10);
  return /BC/i.test(str) ? -Math.abs(n) : n;
}
fetch('entries.json')
  .then(r => {
    if (!r.ok) throw new Error('entries.json not found');
    return r.json();
  })
  .then(entries => {
    const sorted = entries.slice().sort((a, b) => parseYear(a.year) - parseYear(b.year));
    document.getElementById('entries-count').textContent =
      sorted.length + ' recorded attempts \u00b7 0 successes';
    const list = document.getElementById('entries-list');
    sorted.forEach(entry => {
      const card = document.createElement('a');
      card.className = 'entry-card';
      card.href = entry.file;
      const yearEl = document.createElement('div');
      yearEl.className = 'entry-card-year';
      yearEl.textContent = entry.year;
      const body = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'entry-card-title';
      title.textContent = entry.title;
      const desc = document.createElement('div');
      desc.className = 'entry-card-desc';
      desc.textContent = entry.oneliner;
      body.appendChild(title);
      body.appendChild(desc);
      card.appendChild(yearEl);
      card.appendChild(body);
      list.appendChild(card);
    });
  })
  .catch(() => {
    document.getElementById('entries-count').textContent =
      'The archive failed to load. Refresh the page to try again.';
  });
</script>
</body>
</html>
